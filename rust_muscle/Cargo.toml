[workspace]
members = [
    ".",
    "libs/analytical_engine"
]

[package]
name = "rust_muscle"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "rustls-tls-native-roots", "json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
regex = "1.10"
quick-xml = "0.31"
analytical_engine = { path = "libs/analytical_engine" }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres", "mysql", "chrono"] }
csv = "1.3"
rust-s3 = "0.33"
xrust = "2.0"




